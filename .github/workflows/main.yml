# Nombre del workflow
name: 'CI/CD: Construir y Publicar Imagen en Docker Hub'

# --------------------------------------------------
# DISPARADORES (TRIGGERS)
# --------------------------------------------------
on:
  push:
    branches:
      - 'Lab-pruebas'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - 'Lab-pruebas'
  workflow_dispatch:

# --------------------------------------------------
# TRABAJOS (JOBS)
# --------------------------------------------------
jobs:
  build-and-push-to-dockerhub:
    runs-on: ubuntu-latest
    # Los permisos ya no son necesarios para escribir en 'packages' de GitHub
    permissions:
      contents: read

    steps:
      # --- PASO 1: CLONAR EL CÓDIGO ---
      - name: Clonar el código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- PASO 2: INICIAR SESIÓN EN DOCKER HUB ---
      # Aquí está el cambio principal. Usamos tus secretos de Docker Hub.
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          # El 'registry' ya no es necesario, por defecto es Docker Hub
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- PASO 3: CONFIGURAR DOCKER BUILDX ---
      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- PASO 4: EXTRAER METADATOS DE DOCKER ---
      # Ajustamos el nombre de la imagen para que coincida con el formato de Docker Hub.
      - name: Extraer metadatos (etiquetas y labels) para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Formato de imagen para Docker Hub: TU_USUARIO/NOMBRE_IMAGEN
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ia-traductor
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'Lab-pruebas') }}
            type=semver,pattern=v{{version}}

      # --- PASO 5: CONSTRUIR Y SUBIR LA IMAGEN DOCKER ---
      - name: Construir y subir la imagen a Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- PASO 6: MENSAJE DE FINALIZACIÓN ---
      - name: Finalización
        run: echo "✅ ¡Workflow completado! Imagen Docker construida y subida exitosamente a Docker Hub."
        