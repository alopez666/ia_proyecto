# Nombre del workflow
name: 'CI/CD: Construir y Publicar Imagen en Docker Hub'

# --------------------------------------------------
# DISPARADORES (TRIGGERS)
# --------------------------------------------------
on:
  push:
    branches:
      - 'Lab-pruebas'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - 'Lab-pruebas'
  workflow_dispatch:

# --------------------------------------------------
# TRABAJOS (JOBS)
# --------------------------------------------------
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      # --- PASO 1: CLONAR EL CÓDIGO ---
      - name: Clonar el código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- PASO 2: INICIAR SESIÓN EN DOCKER HUB ---
      # Se autentica en Docker Hub usando los secrets que configuraste.
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- PASO 3: CONFIGURAR DOCKER BUILDX ---
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- PASO 4: EXTRAER METADATOS DE DOCKER ---
      # Genera las etiquetas (tags) para la imagen de Docker.
      - name: Extraer metadatos (etiquetas y labels) para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          # IMPORTANTE: Reemplaza con tu usuario y el nombre de la imagen.
          # Formato: TU_USUARIO_DOCKERHUB/NOMBRE_DE_LA_IMAGEN
          images: user9998/ia-traductor
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/Lab-pruebas' }}
            type=sha,prefix=

      # --- PASO 5: CONSTRUIR Y SUBIR LA IMAGEN DOCKER ---
      # Construye la imagen y la sube a Docker Hub.
      - name: Construir y subir la imagen a Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # Solo sube la imagen si el evento NO es un pull request.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Habilita el caché para acelerar futuras construcciones.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- PASO 6: MENSAJE DE FINALIZACIÓN ---
      - name: Mostrar etiquetas de la imagen generada
        if: github.event_name != 'pull_request'
        run: |
          echo "✅ ¡Workflow completado!"
          echo "Imagen subida exitosamente a Docker Hub con las siguientes etiquetas:"
          echo "${{ steps.meta.outputs.tags }}"