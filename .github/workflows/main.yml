# Nombre del workflow
name: 'CI/CD: Construir y Publicar Imagen en Docker Hub'

# --------------------------------------------------
# DISPARADORES (TRIGGERS)
# --------------------------------------------------
on:
  push:
    branches:
      - 'Lab-pruebas'
    tags:
      - 'v*.*.*'   # Se dispara cuando haces push de un tag como v1.2.3
  pull_request:
    branches:
      - 'Lab-pruebas'
  workflow_dispatch:

# --------------------------------------------------
# TRABAJOS (JOBS)
# --------------------------------------------------
jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      # --- PASO 1: CLONAR EL CÓDIGO ---
      - name: Clonar el código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- PASO 2: INICIAR SESIÓN EN DOCKER HUB ---
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- PASO 3: CONFIGURAR DOCKER BUILDX ---
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- PASO 4: EXTRAER METADATOS DE DOCKER ---
      # Genera las etiquetas (tags) a partir del tag de GitHub (vX.Y.Z).
      - name: Extraer metadatos (etiquetas y labels) para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: user9998/ia-traductor
          tags: |
            type=semver,pattern={{version}}   # Usa el tag vX.Y.Z y lo convierte en X.Y.Z

      # --- PASO 5: CONSTRUIR Y SUBIR LA IMAGEN DOCKER ---
      - name: Construir y subir la imagen a Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- PASO 6: MENSAJE DE FINALIZACIÓN ---
      - name: Mostrar etiquetas de la imagen generada
        if: github.event_name != 'pull_request'
        run: |
          echo "✅ ¡Workflow completado!"
          echo "Imagen subida exitosamente a Docker Hub con las siguientes etiquetas:"
          echo "${{ steps.meta.outputs.tags }}"